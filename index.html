<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Master - João Levi</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { 
            --pk-yellow: #FFCB05; --pk-blue: #2A75BB; --pk-red: #EF5350; 
            --pk-dark-blue: #3c5aa6; --pk-gold: #ffd700; --theme-color: #2A75BB; 
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f0f0; margin: 0; padding: 10px; text-align: center; }
        
        /* Container com cor dinâmica do Shop */
        .container { 
            max-width: 500px; margin: auto; background: white; 
            border: 4px solid var(--theme-color); border-radius: 20px; 
            padding: 15px; box-shadow: 0 10px 0 #ccc; min-height: 90vh; position: relative; 
        }
        
        h1 { font-family: 'Press Start 2P', cursive; font-size: 10px; color: var(--pk-dark-blue); margin: 15px 0; }
        .data-atual { font-size: 14px; font-weight: bold; color: #666; margin-bottom: 10px; }
        
        .dashboard { background: #e3f2fd; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 2px solid var(--theme-color); }
        
        /* Moedas e Shop */
        .coin-display { background: #333; color: var(--pk-gold); padding: 8px 15px; border-radius: 20px; font-family: 'Press Start 2P', cursive; font-size: 10px; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; border: 2px solid var(--pk-gold); }
        .shop-btn { background: var(--pk-gold); border: none; padding: 5px 10px; border-radius: 5px; font-family: 'Press Start 2P', cursive; font-size: 8px; cursor: pointer; }

        /* Insígnias */
        .badge-case { display: flex; justify-content: center; gap: 5px; background: #444; padding: 10px; border-radius: 10px; margin: 10px 0; border: 2px solid #222; }
        .badge { width: 35px; height: 35px; filter: grayscale(100%); opacity: 0.3; transition: 0.5s; }
        .badge.unlocked { filter: grayscale(0%); opacity: 1; transform: scale(1.1); }

        /* Booster */
        #booster-area { display: none; margin: 15px 0; padding: 15px; background: linear-gradient(135deg, #6a11cb, #2575fc); border-radius: 15px; color: white; border: 4px solid var(--pk-gold); cursor: pointer; animation: glow 2s infinite; }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 5px var(--pk-gold); } 50% { box-shadow: 0 0 20px var(--pk-gold); } }

        /* Tasks */
        .task-item { background: #fff; padding: 12px; margin: 8px 0; border-radius: 10px; border-left: 5px solid var(--pk-yellow); display: flex; align-items: center; text-align: left; }
        .task-item.checked { background: #e8f5e9; border-left-color: #4caf50; opacity: 0.8; }
        input[type="checkbox"] { width: 22px; height: 22px; margin-right: 15px; }

        .pokedex-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #333; padding: 10px; border-radius: 10px; }
        .pokedex-slot { background: #555; border-radius: 5px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .pokedex-slot img { width: 100%; }

        /* Modais */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .card { background: #fdf6e3; width: 300px; border-radius: 15px; border: 10px solid var(--pk-yellow); padding: 15px; }
        .shop-modal { background: white; padding: 20px; border-radius: 20px; width: 280px; border: 5px solid var(--pk-gold); }
        
        .pokeball-particle { position: fixed; width: 25px; height: 25px; background-image: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png'); background-size: contain; pointer-events: none; z-index: 2000; transition: 1s ease-out; }
    </style>
</head>
<body id="main-body">

<div class="container" id="app-container">
    <div class="coin-display">💰 <span id="coin-count">0</span> <button class="shop-btn" onclick="openShop()">LOJA</button></div>
    
    <h1>MESTRE JOÃO LEVI</h1>
    <div class="data-atual" id="current-date"></div>

    <!-- ESTOJO DE INSÍGNIAS -->
    <div class="badge-case" id="badge-case">
        <!-- IDs das Insígnias de Kanto -->
        <img src="https://archives.bulbagarden.org/media/upload/d/dd/Boulder_Badge.png" class="badge" id="badge-1" title="Insígnia da Rocha">
        <img src="https://archives.bulbagarden.org/media/upload/a/af/Cascade_Badge.png" class="badge" id="badge-2" title="Insígnia da Cascata">
        <img src="https://archives.bulbagarden.org/media/upload/c/c8/Thunder_Badge.png" class="badge" id="badge-3" title="Insígnia do Trovão">
        <img src="https://archives.bulbagarden.org/media/upload/b/b5/Rainbow_Badge.png" class="badge" id="badge-4" title="Insígnia do Arco-Íris">
        <img src="https://archives.bulbagarden.org/media/upload/7/7d/Soul_Badge.png" class="badge" id="badge-5" title="Insígnia da Alma">
        <img src="https://archives.bulbagarden.org/media/upload/6/6b/Marsh_Badge.png" class="badge" id="badge-6" title="Insígnia do Pântano">
        <img src="https://archives.bulbagarden.org/media/upload/0/08/Volcano_Badge.png" class="badge" id="badge-7" title="Insígnia do Vulcão">
        <img src="https://archives.bulbagarden.org/media/upload/7/78/Earth_Badge.png" class="badge" id="badge-8" title="Insígnia da Terra">
    </div>

    <div class="dashboard">
        <div style="font-size: 9px; font-family: 'Press Start 2P'; margin-bottom:10px;">NÍVEL MENSAL: <span id="monthly-text">0</span>%</div>
        <div style="background: #ddd; height: 12px; border-radius: 6px; overflow: hidden;"><div id="monthly-bar" style="height:100%; background: var(--pk-blue); width: 0%"></div></div>
    </div>

    <div id="booster-area" onclick="openBooster()">
        <p style="font-family: 'Press Start 2P'; font-size: 9px;">🎁 BOOSTER PACK DISPONÍVEL!</p>
        <p style="font-size: 11px;">Clique para rasgar e ganhar 6 cartas!</p>
    </div>

    <div id="capture-area" style="display:none; padding:10px; border:3px dashed var(--pk-red); border-radius:15px; margin-bottom:10px;">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" width="40" style="cursor:pointer" onclick="capturePokemon()">
        <p style="font-size:11px; font-weight:bold;">MISSÃO CONCLUÍDA! PEGUE O POKÉMON!</p>
    </div>

    <div id="task-list"></div>

    <div style="margin-top: 20px; text-align: left;">
        <h2 style="font-family: 'Press Start 2P'; font-size: 8px; color: var(--pk-dark-blue);">📔 POKÉDEX</h2>
        <div id="pokedex-grid" class="pokedex-grid"></div>
    </div>
</div>

<!-- MODAL LOJA -->
<div class="modal" id="shop-modal">
    <div class="shop-modal">
        <h2 style="font-family:'Press Start 2P'; font-size:10px;">POKÉ-LOJA</h2>
        <p style="font-size:11px;">Mude a cor do seu App:</p>
        <button onclick="buyTheme('#2A75BB', 0)" style="background:#2A75BB; color:white; padding:10px; margin:5px; border:none; border-radius:5px;">Azul (Grátis)</button>
        <button onclick="buyTheme('#EF5350', 200)" style="background:#EF5350; color:white; padding:10px; margin:5px; border:none; border-radius:5px;">Vermelho (200💰)</button>
        <button onclick="buyTheme('#4caf50', 500)" style="background:#4caf50; color:white; padding:10px; margin:5px; border:none; border-radius:5px;">Verde (500💰)</button>
        <button onclick="buyTheme('#9c27b0', 1000)" style="background:#9c27b0; color:white; padding:10px; margin:5px; border:none; border-radius:5px;">Roxo (1000💰)</button>
        <br><br>
        <button onclick="document.getElementById('shop-modal').style.display='none'" style="font-family:'Press Start 2P'; font-size:8px;">SAIR</button>
    </div>
</div>

<div class="modal" id="modal-card" onclick="if(event.target == this) closeCard()">
    <div class="card" id="pokemon-card-visual">
        <div id="card-content"></div>
        <button onclick="closeCard()" style="width:100%; padding:10px; margin-top:10px; background:var(--pk-red); color:white; border:none; border-radius:5px; font-family:'Press Start 2P'; font-size:8px;">FECHAR</button>
    </div>
</div>

<audio id="bg-music" loop src="https://play.pokemonshowdown.com/audio/music/gsc-gameboyplayer.mp3"></audio>
<audio id="sound-capture" src="https://www.myinstants.com/media/sounds/pokemon-capture.mp3"></audio>
<audio id="sound-booster" src="https://www.myinstants.com/media/sounds/rip-paper.mp3"></audio>
<audio id="sound-coin" src="https://www.myinstants.com/media/sounds/super-mario-coin.mp3"></audio>

<script>
    const TAREFAS_DIARIAS = ["Arrumar o quarto", "Ajudar a mamãe", "Arrumar os brinquedos", "Lição de casa", "Inglês - revisão", "Leitura", "Tabuada", "Caligrafia"];
    const TAREFAS_DOMINGO = ["Arrumar o quarto (🧹)", "Jogar Playstation (🎮)", "Brincar e se divertir (🎈)", "Assistir TV (📺)", "Ser feliz (🌟)"];
    const POKEMONS_BASE = [1, 4, 7, 10, 13, 16, 19, 21, 23, 25, 27, 29, 32, 35, 37, 39, 41, 43, 46, 48, 50, 52, 54, 56, 58, 60, 63, 66, 69, 72, 74, 77, 79, 81, 83, 84, 86, 88, 90, 92, 95, 96, 98, 100, 102, 104, 106, 107, 108, 109, 111, 113, 114, 115, 116, 118, 120, 122, 123, 124, 125, 126, 127, 128, 129, 131, 132, 133, 137, 138, 140, 142, 143, 147];
    const DINO_POKEMON = [
        { id: "d1", name: "Tyrannovolt", type: "Elétrico", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/697.png" },
        { id: "d2", name: "Triceleaf", type: "Planta", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/699.png" },
        { id: "d3", name: "Pterostorm", type: "Voador", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/142.png" },
        { id: "d4", name: "Brontoguard", type: "Rocha", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/698.png" },
        { id: "d5", name: "Raptorshadow", type: "Fantasma", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/461.png" },
        { id: "d6", name: "Spinosurge", type: "Água", img: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/395.png" }
    ];

    function setup() {
        const d = new Date();
        document.getElementById('current-date').innerText = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        
        // Carrega Moedas e Tema
        document.getElementById('coin-count').innerText = localStorage.getItem('joao_levi_coins') || 0;
        const savedTheme = localStorage.getItem('joao_levi_theme') || '#2A75BB';
        document.getElementById('app-container').style.borderColor = savedTheme;

        // Lógica de Booster
        let total = parseInt(localStorage.getItem('joao_levi_total_days') || 0);
        let last = parseInt(localStorage.getItem('joao_levi_last_booster_day') || 0);
        if ((total - last >= 15) || !localStorage.getItem('booster_start')) {
            document.getElementById('booster-area').style.display = 'block';
        }

        loadTasks();
        renderPokedex();
        updateBadges();
    }

    function updateBadges() {
        // Desbloqueia insígnias baseado no percentual mensal (barra azul)
        let mP = parseFloat(document.getElementById('monthly-text').innerText);
        for(let i=1; i<=8; i++) {
            if (mP >= (i * 12.5)) { // 100 / 8 = 12.5% por insígnia
                document.getElementById('badge-' + i).classList.add('unlocked');
            }
        }
    }

    function toggleTask(name) {
        const hoje = new Date().toLocaleDateString('pt-BR');
        let d = JSON.parse(localStorage.getItem(hoje) || "{}");
        const wasChecked = d[name];
        d[name] = !d[name];
        localStorage.setItem(hoje, JSON.stringify(d));
        
        // Ganha Moedas (10 por tarefa, 20 no domingo)
        if (!wasChecked) {
            let coins = parseInt(localStorage.getItem('joao_levi_coins') || 0);
            let gain = (new Date().getDay() === 0) ? 20 : 10;
            localStorage.setItem('joao_levi_coins', coins + gain);
            document.getElementById('coin-count').innerText = coins + gain;
            document.getElementById('sound-coin').play().catch(e=>{});
        }

        // Streak e Total
        let tasks = (new Date().getDay() === 0) ? [...TAREFAS_DOMINGO] : [...TAREFAS_DIARIAS];
        if (tasks.every(t => d[t])) {
            if (localStorage.getItem('joao_levi_lastDone') !== hoje) {
                localStorage.setItem('joao_levi_streak', parseInt(localStorage.getItem('joao_levi_streak') || 0) + 1);
                localStorage.setItem('joao_levi_total_days', parseInt(localStorage.getItem('joao_levi_total_days') || 0) + 1);
                localStorage.setItem('joao_levi_lastDone', hoje);
                createPokeballExplosion();
            }
        }
        loadTasks();
    }

    function openBooster() {
        document.getElementById('sound-booster').play().catch(e=>{});
        createPokeballExplosion();
        document.getElementById('booster-area').style.display = 'none';
        localStorage.setItem('booster_start', 'done');
        localStorage.setItem('joao_levi_last_booster_day', localStorage.getItem('joao_levi_total_days'));

        let dex = JSON.parse(localStorage.getItem('joao_levi_pokedex_MASTER') || "[]");
        // Ganha 2 Dinos + 4 Aleatórios (qualquer ID 1-600)
        for(let i=0; i<2; i++) { let id = DINO_POKEMON[Math.floor(Math.random()*6)].id; if(!dex.includes(id)) dex.push(id); }
        for(let i=0; i<4; i++) { let id = Math.floor(Math.random()*600)+1; if(!dex.includes(id)) dex.push(id); }
        
        localStorage.setItem('joao_levi_pokedex_MASTER', JSON.stringify(dex));
        alert("PACOTINHO ABERTO! 6 novas cartas na Pokédex!");
        renderPokedex();
    }

    function openShop() { document.getElementById('shop-modal').style.display = 'flex'; }

    function buyTheme(color, price) {
        let coins = parseInt(localStorage.getItem('joao_levi_coins') || 0);
        if (coins >= price) {
            localStorage.setItem('joao_levi_coins', coins - price);
            localStorage.setItem('joao_levi_theme', color);
            document.getElementById('coin-count').innerText = coins - price;
            document.getElementById('app-container').style.borderColor = color;
            alert("Tema atualizado!");
        } else {
            alert("Moedas insuficientes! Continue cumprindo tarefas.");
        }
    }

    function createPokeballExplosion() {
        for (let i = 0; i < 25; i++) {
            const b = document.createElement('div'); b.className = 'pokeball-particle';
            b.style.left = Math.random() * 90 + 'vw'; b.style.top = '100vh';
            document.body.appendChild(b);
            setTimeout(() => {
                b.style.transform = `translate(${(Math.random()-0.5)*400}px, -${Math.random()*700+200}px) rotate(${Math.random()*360}deg)`;
                b.style.opacity = '0';
            }, 10);
            setTimeout(() => b.remove(), 1500);
        }
    }

    async function showPokemonCard(id) {
        const modal = document.getElementById('modal-card');
        const content = document.getElementById('card-content');
        modal.style.display = 'flex';
        content.innerHTML = "Carregando...";
        
        const dino = DINO_POKEMON.find(d => d.id == id);
        if (dino) {
            content.innerHTML = `<h3>${dino.name}</h3><img src="${dino.img}" width="150"><p>Tipo: ${dino.type}</p>`;
        } else {
            try {
                const resp = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                const data = await resp.json();
                content.innerHTML = `<h3>${data.name.toUpperCase()}</h3><img src="${data.sprites.other['official-artwork'].front_default}" width="150">`;
            } catch(e) { content.innerHTML = "Erro."; }
        }
    }

    function loadTasks() {
        const today = new Date().toLocaleDateString('pt-BR');
        const dow = new Date().getDay();
        const list = (dow === 0) ? [...TAREFAS_DOMINGO] : [...TAREFAS_DIARIAS];
        let saved = JSON.parse(localStorage.getItem(today) || "{}");
        let html = ""; let done = 0;
        list.forEach(t => {
            const ck = saved[t] ? 'checked' : ''; if(saved[t]) done++;
            html += `<div class="task-item ${ck}"><input type="checkbox" ${ck} onchange="toggleTask('${t}')"><span>${t}</span></div>`;
        });
        document.getElementById('task-list').innerHTML = html;
        let p = (done / list.length) * 100;
        document.getElementById('capture-area').style.display = (p === 100 && !localStorage.getItem('cap_'+today)) ? 'block' : 'none';
        
        // Mensal
        let totalD = 0, totalP = 0;
        for(let i=0; i<30; i++) {
            let d = new Date(); d.setDate(d.getDate()-i); if(d.getDay() === 0) continue;
            totalP += TAREFAS_DIARIAS.length;
            let data = JSON.parse(localStorage.getItem(d.toLocaleDateString('pt-BR')) || "{}");
            Object.values(data).forEach(v => { if(v) totalD++; });
        }
        let mP = ((totalD/totalP)*100) || 0;
        document.getElementById('monthly-bar').style.width = mP + "%";
        document.getElementById('monthly-text').innerText = Math.round(mP);
        updateBadges();
    }

    function renderPokedex() {
        let dex = JSON.parse(localStorage.getItem('joao_levi_pokedex_MASTER') || "[]");
        const grid = document.getElementById('pokedex-grid'); grid.innerHTML = "";
        dex.forEach(id => {
            let isDino = typeof id === 'string';
            let img = isDino ? DINO_POKEMON.find(d => d.id === id).img : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
            grid.innerHTML += `<div class="pokedex-slot" onclick="showPokemonCard('${id}')"><img src="${img}"></div>`;
        });
    }

    function capturePokemon() {
        document.getElementById('sound-capture').play().catch(e=>{});
        createPokeballExplosion();
        const id = POKEMONS_BASE[Math.floor(Math.random() * POKEMONS_BASE.length)];
        let dex = JSON.parse(localStorage.getItem('joao_levi_pokedex_MASTER') || "[]");
        if(!dex.includes(id)) dex.push(id);
        localStorage.setItem('joao_levi_pokedex_MASTER', JSON.stringify(dex));
        localStorage.setItem('cap_' + new Date().toLocaleDateString('pt-BR'), 'true');
        showPokemonCard(id); renderPokedex(); loadTasks();
    }

    function toggleMusic() { const m = document.getElementById('bg-music'); m.paused ? m.play() : m.pause(); }
    function closeCard() { document.getElementById('modal-card').style.display = 'none'; }
    window.onload = setup;
</script>
</body>
</html>
