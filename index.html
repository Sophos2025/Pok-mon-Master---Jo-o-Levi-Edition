<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Master - João Levi</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --pk-yellow: #FFCB05; --pk-blue: #2A75BB; --pk-red: #EF5350; --pk-dark-blue: #3c5aa6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f0f0; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; border: 4px solid var(--pk-blue); border-radius: 20px; padding: 15px; box-shadow: 0 10px 0 #ccc; min-height: 90vh; }
        
        h1 { font-family: 'Press Start 2P', cursive; font-size: 11px; color: var(--pk-dark-blue); margin: 15px 0; line-height: 1.5; }
        .data-atual { font-size: 14px; font-weight: bold; color: #666; margin-bottom: 10px; text-transform: capitalize; }

        .audio-ctrl { background: var(--pk-blue); color: white; border: none; padding: 8px; border-radius: 50%; cursor: pointer; position: absolute; top: 15px; right: 15px; font-size: 18px; width: 40px; height: 40px; z-index: 100; }

        .dashboard { background: #e3f2fd; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 2px solid var(--pk-blue); position: relative; }
        .partner-area { display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; border-radius: 15px; padding: 10px; margin: 0 auto 10px; border: 3px solid var(--pk-yellow); width: 120px; height: 120px; }
        .partner-img { width: 90px; height: 90px; object-fit: contain; }

        .stat-row { margin: 10px 0; text-align: left; }
        .label { font-weight: bold; font-size: 11px; display: block; margin-bottom: 5px; color: var(--pk-dark-blue); }
        .progress-bar-bg { background: #ddd; height: 18px; border-radius: 10px; overflow: hidden; border: 1px solid #999; position: relative; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width 0.5s; width: 0%; }

        .timer-box { background: #222; color: #0f0; padding: 10px; border-radius: 10px; font-family: 'Press Start 2P', cursive; margin: 15px 0; }
        .timer-display { font-size: 20px; margin-bottom: 10px; }
        .timer-btn { background: var(--pk-red); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 8px; }
        .reset-btn { background: #555; margin-left: 5px; }

        .task-item { background: #fff; padding: 12px; margin: 8px 0; border-radius: 10px; border-left: 5px solid var(--pk-yellow); display: flex; align-items: center; text-align: left; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); font-size: 14px; }
        .task-item.checked { background: #e8f5e9; border-left-color: #4caf50; text-decoration: line-through; color: #777; }
        input[type="checkbox"] { width: 22px; height: 22px; margin-right: 15px; cursor: pointer; }

        #capture-area { margin: 20px 0; display: none; padding: 15px; border: 4px solid var(--pk-red); border-radius: 15px; background: #fff; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-5px);} }
        
        .pokedex-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #333; padding: 10px; border-radius: 10px; min-height: 60px; }
        .pokedex-slot { background: #555; border-radius: 5px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
        .pokedex-slot img { width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="container" style="position: relative;">
    <button class="audio-ctrl" onclick="toggleMusic()" id="music-btn">🔈</button>
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" width="120" alt="Pokemon">
    
    <h1>MESTRE TREINADOR:<br>JOÃO LEVI</h1>
    <div class="data-atual" id="current-date">Carregando data...</div>

    <div class="dashboard">
        <div class="partner-area">
            <span id="partner-name" style="font-size: 7px; font-family: 'Press Start 2P'; margin-bottom: 5px; color:#333;">...</span>
            <img id="partner-img" class="partner-img" src="" alt="Parceiro">
        </div>
        <div style="font-size: 9px; font-family: 'Press Start 2P'; margin-bottom: 10px;">
            STREAK: <span id="streak-count">0</span> DIAS 🔥
        </div>

        <div class="stat-row">
            <span class="label">ENERGIA DO DIA</span>
            <div class="progress-bar-bg"><div id="daily-bar" class="progress-fill"></div></div>
        </div>
        <div class="stat-row">
            <span class="label">NÍVEL MENSAL (BÔNUS)</span>
            <div class="progress-bar-bg"><div id="monthly-bar" class="progress-fill" style="background: var(--pk-blue)"></div></div>
        </div>
        
        <div style="display: flex; justify-content: space-around; font-weight: bold; font-size: 14px; color: var(--pk-dark-blue); background: white; padding: 10px; border-radius: 10px; border: 1px solid #ddd;">
            <div>💰 R$ <span id="bonus-money">0.00</span></div>
            <div>🎮 +<span id="bonus-time">0</span> min</div>
        </div>
    </div>

    <div id="capture-area">
        <p style="font-family: 'Press Start 2P'; font-size: 8px; color: var(--pk-red);">POKÉMON SELVAGEM APARECEU!</p>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" width="50" style="cursor:pointer" onclick="capturePokemon()">
        <p style="font-size: 11px; font-weight: bold;">Toque na Pokébola!</p>
    </div>

    <div class="timer-box">
        <div class="timer-display" id="timer">15:00</div>
        <div class="timer-controls">
            <button class="timer-btn" onclick="toggleTimer()" id="btn-timer">INICIAR</button>
            <button class="timer-btn reset-btn" onclick="resetTimer()">↻</button>
        </div>
    </div>

    <div id="task-list">Carregando tarefas...</div>

    <div style="margin-top: 30px; text-align: left;">
        <h2 style="font-family: 'Press Start 2P'; font-size: 9px; color: var(--pk-dark-blue);">📔 POKÉDEX</h2>
        <div id="pokedex-grid" class="pokedex-grid"></div>
    </div>

    <div style="margin-top: 40px; border-top: 1px dashed #ccc; padding-top: 10px;">
        <button onclick="if(confirm('Isso vai apagar sua Pokédex e progresso! Tem certeza?')){localStorage.clear(); location.reload();}" style="font-size: 8px; background: none; border: 1px solid #ccc; color: #999; padding: 5px; cursor: pointer; border-radius: 5px;">Reiniciar Toda a Jornada</button>
    </div>
</div>

<!-- Audios -->
<audio id="bg-music" loop src="https://play.pokemonshowdown.com/audio/music/gsc-gameboyplayer.mp3"></audio>
<audio id="sound-capture" src="https://www.myinstants.com/media/sounds/pokemon-capture.mp3"></audio>
<audio id="sound-level" src="https://www.myinstants.com/media/sounds/level-up-pokemon.mp3"></audio>

<script>
    // Configurações e Variáveis
    const TAREFAS_DIARIAS = ["Arrumar o quarto", "Ajudar a mamãe", "Arrumar os brinquedos", "Lição de casa", "Inglês - revisão", "Leitura", "Tabuada", "Caligrafia"];
    const TAREFA_PIANO = "Tocar Piano (🎹)";
    const STARTERS = [[4,5,6], [1,2,3], [7,8,9]]; // Charmander, Bulbasaur, Squirtle

    let timerInterval, timeLeft = 15 * 60, timerRunning = false;

    // Função Inicial
    function setup() {
        const d = new Date();
        const opcoes = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('current-date').innerText = d.toLocaleDateString('pt-BR', opcoes);
        
        updatePartner();
        loadTasks();
        renderPokedex();
    }

    // Gerenciamento de Música
    function toggleMusic() {
        const music = document.getElementById('bg-music');
        const btn = document.getElementById('music-btn');
        if (music.paused) {
            music.play().catch(e => console.log("Erro ao tocar música: ", e));
            btn.innerText = "🔊";
        } else {
            music.pause();
            btn.innerText = "🔈";
        }
    }

    // Evolução e Streak
    function updatePartner() {
        let streak = parseInt(localStorage.getItem('streak') || 0);
        let cycle = parseInt(localStorage.getItem('cycle') || 0) % 3;
        document.getElementById('streak-count').innerText = streak;

        let stage = 0;
        if (streak >= 7) stage = 1;
        if (streak >= 14) stage = 2;
        
        if (streak >= 21) {
            alert("21 DIAS! Incrível João Levi! Você completou um ciclo e ganhou uma insígnia! Vamos começar com um novo Pokémon!");
            localStorage.setItem('streak', 0);
            localStorage.setItem('cycle', cycle + 1);
            location.reload();
            return;
        }

        const pokeId = STARTERS[cycle][stage];
        document.getElementById('partner-img').src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/" + pokeId + ".png";
        
        const names = {1:"Bulbasaur", 2:"Ivysaur", 3:"Venusaur", 4:"Charmander", 5:"Charmeleon", 6:"Charizard", 7:"Squirtle", 8:"Wartortle", 9:"Blastoise"};
        document.getElementById('partner-name').innerText = names[pokeId] || "Pokémon";
    }

    // Carregar Lista
    function loadTasks() {
        const today = new Date().toLocaleDateString('pt-BR');
        const dayOfWeek = new Date().getDay(); 
        const taskListDiv = document.getElementById('task-list');

        if (dayOfWeek === 0) {
            taskListDiv.innerHTML = "<div style='padding:20px; color:orange; font-family:\"Press Start 2P\"; font-size:10px;'>DOMINGO LIVRE! APROVEITE SEU DESCANSO! 🎮</div>";
            updateDashboard(100);
            return;
        }

        let tasksParaHoje = [...TAREFAS_DIARIAS];
        if ([2,3,4].includes(dayOfWeek)) tasksParaHoje.push(TAREFA_PIANO);

        let dadosSalvos = JSON.parse(localStorage.getItem(today) || "{}");
        let concluidas = 0;
        let html = "";

        tasksParaHoje.forEach(task => {
            const check = dadosSalvos[task] ? 'checked' : '';
            if(dadosSalvos[task]) concluidas++;
            html += '<div class="task-item ' + check + '">' +
                '<input type="checkbox" ' + check + ' onchange="toggleTask(\'' + task + '\')">' +
                '<span>' + task + '</span>' +
            '</div>';
        });

        taskListDiv.innerHTML = html;
        let percent = (concluidas / tasksParaHoje.length) * 100;
        updateDashboard(percent);
        
        if (percent === 100 && !localStorage.getItem('cap_' + today)) {
            document.getElementById('capture-area').style.display = 'block';
        } else {
            document.getElementById('capture-area').style.display = 'none';
        }
    }

    function toggleTask(nome) {
        const hoje = new Date().toLocaleDateString('pt-BR');
        let dados = JSON.parse(localStorage.getItem(hoje) || "{}");
        dados[nome] = !dados[nome];
        localStorage.setItem(hoje, JSON.stringify(dados));

        // Lógica de Streak
        const dayOfWeek = new Date().getDay();
        let tasksParaHoje = [...TAREFAS_DIARIAS];
        if ([2,3,4].includes(dayOfWeek)) tasksParaHoje.push(TAREFA_PIANO);
        
        let todasConcluidas = tasksParaHoje.every(t => dados[t]);

        if (todasConcluidas) {
            if (localStorage.getItem('lastDoneDate') !== hoje) {
                let s = parseInt(localStorage.getItem('streak') || 0) + 1;
                localStorage.setItem('streak', s);
                localStorage.setItem('lastDoneDate', hoje);
                if (s === 7 || s === 14) {
                    document.getElementById('sound-level').play().catch(e=>{});
                }
            }
        }
        
        loadTasks();
        updatePartner();
    }

    function updateDashboard(dailyP) {
        document.getElementById('daily-bar').style.width = dailyP + "%";
        
        // Cálculo Mensal
        let totalFeito = 0, totalPossivel = 0;
        for(let i=0; i<30; i++) {
            let d = new Date(); d.setDate(d.getDate() - i);
            if(d.getDay() === 0) continue;
            let key = d.toLocaleDateString('pt-BR');
            let qtasTasks = TAREFAS_DIARIAS.length + ([2,3,4].includes(d.getDay()) ? 1 : 0);
            totalPossivel += qtasTasks;
            let data = JSON.parse(localStorage.getItem(key) || "{}");
            Object.values(data).forEach(v => { if(v) totalFeito++; });
        }
        
        let monthP = (totalFeito / totalPossivel * 100) || 0;
        document.getElementById('monthly-bar').style.width = monthP + "%";
        
        let cash = monthP >= 50 ? (20 * (monthP/100)) : 0;
        let mins = monthP >= 50 ? (30 * (monthP/100)) : 0;
        document.getElementById('bonus-money').innerText = cash.toFixed(2);
        document.getElementById('bonus-time').innerText = Math.round(mins);
    }

    // Pokédex e Captura
    function capturePokemon() {
        try { document.getElementById('sound-capture').play(); } catch(e) {}
        const pokeId = Math.floor(Math.random() * 151) + 1;
        let dex = JSON.parse(localStorage.getItem('pokedex_v2') || "[]");
        if(!dex.includes(pokeId)) dex.push(pokeId);
        localStorage.setItem('pokedex_v2', JSON.stringify(dex));
        localStorage.setItem('cap_' + new Date().toLocaleDateString('pt-BR'), 'true');
        
        alert("GOTCHA! Você capturou um Pokémon ID #" + pokeId);
        document.getElementById('capture-area').style.display = 'none';
        renderPokedex();
    }

    function renderPokedex() {
        let dex = JSON.parse(localStorage.getItem('pokedex_v2') || "[]");
        const grid = document.getElementById('pokedex-grid');
        grid.innerHTML = "";
        let slots = Math.max(10, dex.length + 1);
        for(let i=0; i<slots; i++) {
            grid.innerHTML += '<div class="pokedex-slot">' + 
                (dex[i] ? '<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + dex[i] + '.png">' : '') + 
                '</div>';
        }
    }

    // Cronômetro
    function toggleTimer() {
        const btn = document.getElementById('btn-timer');
        if(timerRunning) { 
            clearInterval(timerInterval); 
            btn.innerText = "VOLTAR"; 
        } else {
            timerInterval = setInterval(() => {
                timeLeft--; 
                updateTimerDisplay();
                if(timeLeft <= 0) { 
                    clearInterval(timerInterval); 
                    alert("Tempo esgotado! Bom trabalho!"); 
                    resetTimer(); 
                }
            }, 1000);
            btn.innerText = "PAUSAR";
        }
        timerRunning = !timerRunning;
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerRunning = false;
        timeLeft = 15 * 60;
        updateTimerDisplay();
        document.getElementById('btn-timer').innerText = "INICIAR";
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('timer').innerText = m + ":" + (s < 10 ? '0' : '') + s;
    }

    // Iniciar tudo ao carregar a página
    window.onload = setup;
</script>

</body>
</html>
