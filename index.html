<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Master - João Levi</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --pk-yellow: #FFCB05; --pk-blue: #2A75BB; --pk-red: #EF5350; --pk-dark-blue: #3c5aa6; --pk-green: #4caf50; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f0f0; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; border: 4px solid var(--pk-blue); border-radius: 20px; padding: 15px; box-shadow: 0 10px 0 #ccc; min-height: 90vh; }
        h1 { font-family: 'Press Start 2P', cursive; font-size: 11px; color: var(--pk-dark-blue); margin: 15px 0; line-height: 1.5; }
        .data-atual { font-size: 14px; font-weight: bold; color: #666; margin-bottom: 10px; text-transform: capitalize; }
        .audio-ctrl { background: var(--pk-blue); color: white; border: none; padding: 8px; border-radius: 50%; cursor: pointer; position: absolute; top: 15px; right: 15px; font-size: 18px; width: 40px; height: 40px; z-index: 100; }
        .dashboard { background: #e3f2fd; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 2px solid var(--pk-blue); position: relative; }
        .partner-area { display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; border-radius: 15px; padding: 10px; margin: 0 auto 10px; border: 3px solid var(--pk-yellow); width: 120px; height: 120px; }
        .partner-img { width: 90px; height: 90px; object-fit: contain; }
        .stat-row { margin: 10px 0; text-align: left; }
        .label { font-weight: bold; font-size: 10px; display: block; margin-bottom: 5px; color: var(--pk-dark-blue); }
        .progress-bar-bg { background: #ddd; height: 18px; border-radius: 10px; overflow: hidden; border: 1px solid #999; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width 0.5s; width: 0%; }
        .timer-box { background: #222; color: #0f0; padding: 10px; border-radius: 10px; font-family: 'Press Start 2P', cursive; margin: 15px 0; }
        .timer-display { font-size: 20px; margin-bottom: 10px; }
        .timer-btn { background: var(--pk-red); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 8px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 10px; }
        .card { background: #fdf6e3; width: 100%; max-width: 320px; border-radius: 15px; border: 10px solid var(--pk-yellow); padding: 15px; box-sizing: border-box; overflow-y: auto; max-height: 90vh; }
        .card-header { font-family: 'Press Start 2P', cursive; font-size: 10px; color: #333; margin-bottom: 10px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .card-img-box { background: white; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 10px; }
        .card-img { width: 150px; height: 150px; }
        .info-tag { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; color: white; margin: 2px; text-transform: uppercase; }
        .section-title { font-size: 11px; font-weight: bold; color: var(--pk-dark-blue); margin-top: 10px; border-top: 1px solid #ddd; padding-top: 5px; text-align: left; }
        .attr-list { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 5px; margin-top: 5px; }
        .task-item { background: #fff; padding: 12px; margin: 8px 0; border-radius: 10px; border-left: 5px solid var(--pk-yellow); display: flex; align-items: center; text-align: left; }
        .task-item.checked { background: #e8f5e9; border-left-color: #4caf50; opacity: 0.8; }
        input[type="checkbox"] { width: 22px; height: 22px; margin-right: 15px; }
        .pokedex-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #333; padding: 10px; border-radius: 10px; }
        .pokedex-slot { background: #555; border-radius: 5px; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .pokedex-slot img { width: 100%; }
        #capture-area { display: none; background: #fff5f5; border: 3px dashed var(--pk-red); padding: 15px; border-radius: 15px; margin: 15px 0; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.03);} 100% {transform: scale(1);} }
    </style>
</head>
<body>

<div class="container" style="position: relative;">
    <button class="audio-ctrl" onclick="toggleMusic()" id="music-btn">🔈</button>
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" width="120">
    <h1>MESTRE TREINADOR:<br>JOÃO LEVI</h1>
    <div class="data-atual" id="current-date"></div>

    <div class="dashboard">
        <div class="partner-area">
            <span id="partner-name" style="font-size: 7px; font-family: 'Press Start 2P'; margin-bottom: 5px;">...</span>
            <img id="partner-img" class="partner-img" src="" alt="Parceiro">
        </div>
        <div style="font-size: 9px; font-family: 'Press Start 2P';">STREAK: <span id="streak-count">0</span> DIAS 🔥</div>
        <div class="stat-row">
            <span class="label">ENERGIA DO DIA</span>
            <div class="progress-bar-bg"><div id="daily-bar" class="progress-fill"></div></div>
        </div>
        <div class="stat-row">
            <span class="label">NÍVEL MENSAL (BÔNUS)</span>
            <div class="progress-bar-bg"><div id="monthly-bar" class="progress-fill" style="background: var(--pk-blue)"></div></div>
        </div>
        <div style="display: flex; justify-content: space-around; font-weight: bold; font-size: 14px; background: white; padding: 10px; border-radius: 10px;">
            <div>💰 R$ <span id="bonus-money">0.00</span></div>
            <div>🎮 +<span id="bonus-time">0</span> min</div>
        </div>
    </div>

    <div id="capture-area">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" width="50" style="cursor:pointer" onclick="capturePokemon()">
        <p style="font-size: 11px; font-weight: bold; color: var(--pk-red);">POKÉMON SELVAGEM APARECEU!</p>
    </div>

    <div class="timer-box">
        <div class="timer-display" id="timer">15:00</div>
        <button class="timer-btn" onclick="toggleTimer()" id="btn-timer">INICIAR</button>
        <button class="timer-btn" onclick="resetTimer()" style="background:#555">↻</button>
    </div>

    <div id="task-list"></div>

    <div style="margin-top: 30px; text-align: left;">
        <h2 style="font-family: 'Press Start 2P'; font-size: 8px; color: var(--pk-dark-blue);">📔 POKÉDEX (CLIQUE NO POKÉMON)</h2>
        <div id="pokedex-grid" class="pokedex-grid"></div>
    </div>
</div>

<div class="modal" id="modal-card" onclick="if(event.target == this) closeCard()">
    <div class="card">
        <div class="card-header" id="card-title">INFO POKÉMON</div>
        <div class="card-img-box"><img src="" id="card-img" class="card-img"></div>
        <div id="card-content" style="text-align: left;"><p>Buscando na Pokédex...</p></div>
        <button class="close-card" onclick="closeCard()">FECHAR</button>
    </div>
</div>

<audio id="bg-music" loop src="https://play.pokemonshowdown.com/audio/music/gsc-gameboyplayer.mp3"></audio>
<audio id="sound-capture" src="https://www.myinstants.com/media/sounds/pokemon-capture.mp3"></audio>
<audio id="sound-level" src="https://www.myinstants.com/media/sounds/level-up-pokemon.mp3"></audio>
<audio id="sound-timer" src="https://www.myinstants.com/media/sounds/pokemon-recovery-sound.mp3"></audio>

<script>
    const TAREFAS_DIARIAS = ["Arrumar o quarto", "Ajudar a mamãe", "Arrumar os brinquedos", "Lição de casa", "Inglês - revisão", "Leitura", "Tabuada", "Caligrafia"];
    const TAREFA_PIANO = "Tocar Piano (🎹)";
    const STARTERS = [[4,5,6], [1,2,3], [7,8,9]];
    
    // LISTA DE POKÉMONS BASE (SEM EVOLUÇÃO OU ESTÁGIO 1)
    const POKEMONS_BASE = [1, 4, 7, 10, 13, 16, 19, 21, 23, 25, 27, 29, 32, 35, 37, 39, 41, 43, 46, 48, 50, 52, 54, 56, 58, 60, 63, 66, 69, 72, 74, 77, 79, 81, 83, 84, 86, 88, 90, 92, 95, 96, 98, 100, 102, 104, 106, 107, 108, 109, 111, 113, 114, 115, 116, 118, 120, 122, 123, 124, 125, 126, 127, 128, 129, 131, 132, 133, 137, 138, 140, 142, 143, 147];

    const TYPE_MAP = { fire:"Fogo", water:"Água", grass:"Planta", electric:"Elétrico", psychic:"Psíquico", ice:"Gelo", dragon:"Dragão", dark:"Sombrio", fairy:"Fada", normal:"Normal", fighting:"Lutador", flying:"Voador", poison:"Veneno", ground:"Terra", rock:"Pedra", bug:"Inseto", ghost:"Fantasma", steel:"Aço" };
    const TYPE_COLORS = { fire:"#F08030", water:"#6890F0", grass:"#78C850", electric:"#F8D030", psychic:"#F85888", ice:"#98D8D8", dragon:"#7038F8", dark:"#705848", fairy:"#EE99AC", normal:"#A8A878", fighting:"#C03028", flying:"#A890F0", poison:"#A040A0", ground:"#E0C068", rock:"#B8A038", bug:"#A8B820", ghost:"#705898", steel:"#B8B8D0" };

    let timerInterval, timeLeft = 15 * 60, timerRunning = false;

    function setup() {
        const d = new Date();
        document.getElementById('current-date').innerText = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        updatePartner();
        loadTasks();
        renderPokedex();
    }

    function toggleMusic() {
        const m = document.getElementById('bg-music');
        const b = document.getElementById('music-btn');
        if (m.paused) { m.play().catch(e=>{}); b.innerText = "🔊"; }
        else { m.pause(); b.innerText = "🔈"; }
    }

    function updatePartner() {
        let streak = parseInt(localStorage.getItem('joao_levi_streak') || 0);
        let cycle = parseInt(localStorage.getItem('joao_levi_cycle') || 0) % 3;
        document.getElementById('streak-count').innerText = streak;
        let stage = streak >= 14 ? 2 : (streak >= 7 ? 1 : 0);
        const pokeId = STARTERS[cycle][stage];

        let lastStage = parseInt(localStorage.getItem('joao_levi_lastStage') || 0);
        if (stage > lastStage) {
            showPokemonCard(pokeId, "O QUÊ? ELE EVOLUIU!");
            document.getElementById('sound-level').play().catch(e=>{});
        }
        localStorage.setItem('joao_levi_lastStage', stage);
        document.getElementById('partner-img').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokeId}.png`;
        const names = {1:"Bulbasaur", 2:"Ivysaur", 3:"Venusaur", 4:"Charmander", 5:"Charmeleon", 6:"Charizard", 7:"Squirtle", 8:"Wartortle", 9:"Blastoise"};
        document.getElementById('partner-name').innerText = names[pokeId] || "Pokémon";
    }

    async function showPokemonCard(id, title = "INFO POKÉMON") {
        const modal = document.getElementById('modal-card');
        const content = document.getElementById('card-content');
        document.getElementById('card-img').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
        document.getElementById('card-title').innerText = title;
        modal.style.display = 'flex';
        content.innerHTML = "<p>Buscando dados...</p>";

        try {
            const resp = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
            const data = await resp.json();
            const typeResp = await fetch(data.types[0].type.url);
            const typeData = await typeResp.json();

            const vant = typeData.damage_relations.double_damage_to.map(t => `<span class="info-tag" style="background:${TYPE_COLORS[t.name]}">${TYPE_MAP[t.name]}</span>`).join('') || "Nenhuma";
            const fraq = typeData.damage_relations.double_damage_from.map(t => `<span class="info-tag" style="background:${TYPE_COLORS[t.name]}">${TYPE_MAP[t.name]}</span>`).join('') || "Nenhuma";
            const tipos = data.types.map(t => `<span class="info-tag" style="background:${TYPE_COLORS[t.type.name]}">${TYPE_MAP[t.type.name]}</span>`).join('');

            content.innerHTML = `
                <div style="font-weight:bold; font-size:16px; margin-bottom:5px;">${data.name.toUpperCase()}</div>
                <div style="margin-bottom:10px;">${tipos}</div>
                <div class="section-title">VANTAGEM CONTRA:</div><div class="attr-list">${vant}</div>
                <div class="section-title">FRAQUEZA CONTRA:</div><div class="attr-list">${fraq}</div>
                <div class="section-title">ATRIBUTOS:</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; font-size:11px; gap:3px; margin-top:5px;">
                    <div>ATAQUE: ${data.stats[1].base_stat}</div><div>DEFESA: ${data.stats[2].base_stat}</div>
                    <div>VIDA: ${data.stats[0].base_stat}</div><div>VELOC: ${data.stats[5].base_stat}</div>
                </div>
            `;
        } catch (e) { content.innerHTML = "Erro ao carregar dados."; }
    }

    function closeCard() { document.getElementById('modal-card').style.display = 'none'; }

    function loadTasks() {
        const today = new Date().toLocaleDateString('pt-BR');
        const dow = new Date().getDay();
        const div = document.getElementById('task-list');
        if (dow === 0) { div.innerHTML = "<p>DOMINGO LIVRE! 🎮</p>"; updateDashboard(100); return; }
        let tasks = [...TAREFAS_DIARIAS]; if ([2,4,6].includes(dow)) tasks.push(TAREFA_PIANO);
        let saved = JSON.parse(localStorage.getItem(today) || "{}");
        let html = ""; let done = 0;
        tasks.forEach(t => {
            const ck = saved[t] ? 'checked' : ''; if(saved[t]) done++;
            html += `<div class="task-item ${ck}"><input type="checkbox" ${ck} onchange="toggleTask('${t}')"><span>${t}</span></div>`;
        });
        div.innerHTML = html;
        let p = (done / tasks.length) * 100;
        updateDashboard(p);
        document.getElementById('capture-area').style.display = (p === 100 && !localStorage.getItem('cap_'+today)) ? 'block' : 'none';
    }

    function toggleTask(name) {
        const hoje = new Date().toLocaleDateString('pt-BR');
        let d = JSON.parse(localStorage.getItem(hoje) || "{}");
        d[name] = !d[name]; localStorage.setItem(hoje, JSON.stringify(d));
        let tasks = [...TAREFAS_DIARIAS]; if ([2,4,6].includes(new Date().getDay())) tasks.push(TAREFA_PIANO);
        if (tasks.every(t => d[t])) {
            if (localStorage.getItem('joao_levi_lastDone') !== hoje) {
                let s = parseInt(localStorage.getItem('joao_levi_streak') || 0) + 1;
                localStorage.setItem('joao_levi_streak', s); localStorage.setItem('joao_levi_lastDone', hoje);
            }
        }
        loadTasks(); updatePartner();
    }

    function updateDashboard(dailyP) {
        document.getElementById('daily-bar').style.width = dailyP + "%";
        let doneT = 0, possT = 0;
        for(let i=0; i<30; i++) {
            let d = new Date(); d.setDate(d.getDate() - i); if(d.getDay() === 0) continue;
            let key = d.toLocaleDateString('pt-BR');
            let q = TAREFAS_DIARIAS.length + ([2,4,6].includes(d.getDay()) ? 1 : 0);
            possT += q; let data = JSON.parse(localStorage.getItem(key) || "{}");
            Object.values(data).forEach(v => { if(v) doneT++; });
        }
        let mP = (doneT / possT * 100) || 0;
        document.getElementById('monthly-bar').style.width = mP + "%";
        document.getElementById('bonus-money').innerText = (mP >= 50 ? (20 * (mP/100)) : 0).toFixed(2);
        document.getElementById('bonus-time').innerText = Math.round(mP >= 50 ? (30 * (mP/100)) : 0);
    }

    async function capturePokemon() {
        document.getElementById('sound-capture').play().catch(e=>{});
        
        // --- AQUI ESTÁ A MUDANÇA: Sorteia apenas da lista de BASE ---
        const randomIndex = Math.floor(Math.random() * POKEMONS_BASE.length);
        const id = POKEMONS_BASE[randomIndex];
        
        let dex = JSON.parse(localStorage.getItem('joao_levi_pokedex_MASTER') || "[]");
        if(!dex.includes(id)) dex.push(id);
        localStorage.setItem('joao_levi_pokedex_MASTER', JSON.stringify(dex));
        localStorage.setItem('cap_' + new Date().toLocaleDateString('pt-BR'), 'true');
        await showPokemonCard(id, "VOCÊ CAPTUROU!");
        renderPokedex(); loadTasks();
    }

    function renderPokedex() {
        let dex = JSON.parse(localStorage.getItem('joao_levi_pokedex_MASTER') || "[]");
        const grid = document.getElementById('pokedex-grid'); grid.innerHTML = "";
        for(let i=0; i<Math.max(10, dex.length+1); i++) {
            grid.innerHTML += `<div class="pokedex-slot" onclick="${dex[i] ? `showPokemonCard(${dex[i]})` : ''}">${dex[i] ? `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${dex[i]}.png">` : ''}</div>`;
        }
    }

    function toggleTimer() {
        if(timerRunning) { clearInterval(timerInterval); document.getElementById('btn-timer').innerText = "VOLTAR"; } 
        else {
            timerInterval = setInterval(() => { 
                timeLeft--; updateTimerDisplay(); 
                if(timeLeft <= 0) { 
                    clearInterval(timerInterval); document.getElementById('sound-timer').play().catch(e=>{});
                    alert("TEMPO CONCLUÍDO! BOM TRABALHO!"); resetTimer(); 
                } 
            }, 1000);
            document.getElementById('btn-timer').innerText = "PAUSAR";
        }
        timerRunning = !timerRunning;
    }
    function resetTimer() { clearInterval(timerInterval); timerRunning = false; timeLeft = 15 * 60; updateTimerDisplay(); document.getElementById('btn-timer').innerText = "INICIAR"; }
    function updateTimerDisplay() { 
        const m = Math.floor(timeLeft / 60); const s = timeLeft % 60;
        document.getElementById('timer').innerText = m + ":" + (s < 10 ? '0' : '') + s; 
    }
    window.onload = setup;
</script>
</body>
</html>
