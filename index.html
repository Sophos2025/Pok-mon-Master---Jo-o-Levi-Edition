<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Master - João Levi</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --pk-yellow: #FFCB05; --pk-blue: #2A75BB; --pk-red: #EF5350; --pk-dark-blue: #3c5aa6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f0f0; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; border: 4px solid var(--pk-blue); border-radius: 20px; padding: 15px; box-shadow: 0 10px 0 #ccc; }
        
        h1 { font-family: 'Press Start 2P', cursive; font-size: 11px; color: var(--pk-dark-blue); margin: 15px 0; line-height: 1.5; }
        .data-atual { font-size: 14px; font-weight: bold; color: #666; margin-bottom: 10px; }

        /* Audio Control */
        .audio-ctrl { background: var(--pk-blue); color: white; border: none; padding: 8px; border-radius: 50%; cursor: pointer; position: absolute; top: 20px; right: 20px; font-size: 18px; width: 40px; height: 40px; }

        /* Dashboard e Partner */
        .dashboard { background: #e3f2fd; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 2px solid var(--pk-blue); position: relative; }
        .partner-area { display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; border-radius: 15px; padding: 10px; margin: 0 auto 10px; border: 3px solid var(--pk-yellow); width: 120px; }
        .partner-img { width: 80px; height: 80px; }

        .stat-row { margin: 10px 0; text-align: left; }
        .label { font-weight: bold; font-size: 11px; display: block; margin-bottom: 5px; color: var(--pk-dark-blue); }
        .progress-bar-bg { background: #ddd; height: 18px; border-radius: 10px; overflow: hidden; border: 1px solid #999; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width 0.5s; width: 0%; }

        /* Timer */
        .timer-box { background: #222; color: #0f0; padding: 10px; border-radius: 10px; font-family: 'Press Start 2P', cursive; margin: 15px 0; }
        .timer-display { font-size: 20px; margin-bottom: 10px; }
        .timer-controls { display: flex; justify-content: center; gap: 10px; }
        .timer-btn { background: var(--pk-red); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 8px; }
        .reset-btn { background: #555; }

        /* Task List */
        .task-item { background: #fff; padding: 12px; margin: 8px 0; border-radius: 10px; border-left: 5px solid var(--pk-yellow); display: flex; align-items: center; text-align: left; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); font-size: 14px; }
        .task-item.checked { background: #e8f5e9; border-left-color: #4caf50; text-decoration: line-through; color: #777; }
        input[type="checkbox"] { width: 22px; height: 22px; margin-right: 15px; cursor: pointer; }

        /* Capture & Pokedex */
        #capture-area { margin: 20px 0; display: none; padding: 15px; border: 4px solid var(--pk-red); border-radius: 15px; background: #fff; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-5px);} }
        .pokedex-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #333; padding: 10px; border-radius: 10px; min-height: 50px; }
